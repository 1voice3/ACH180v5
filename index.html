<style>
:root{--bench:#23262a;--tray:#2e3237;--line:#444a51;--ink:#e8eaed;--mut:#a3aab2;--crim:#c02341;--amber:#e0a030;--green:#4cc27d;--cyan:#55bfd2;
--sans:-apple-system,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bench);color:var(--ink);font:16px/1.4 var(--sans)}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.top{padding:calc(8px + env(safe-area-inset-top)) 14px 6px;display:flex;flex-direction:column;gap:2px}.top span{font-size:12px;color:var(--mut)}
.drive{padding:6px 12px}
/* compact strip on non-panel tabs */
.strip{display:none;width:100%;align-items:center;gap:10px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#1c1f22;color:var(--ink);font:600 14px var(--mono);text-align:left;position:sticky;top:0;z-index:5}
body:not([data-view=panel]) .strip{display:flex}body:not([data-view=panel]) .panelwrap{display:none}
.led{display:inline-block;width:14px;height:14px;border-radius:2px;background:#4cc27d;flex:none}
.led.red{background:#e0243f}.led.greenflash{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
/* the panel */
.case{max-width:420px;margin:0 auto;background:linear-gradient(#f4f5f5,#e6e8e8);border-radius:20px;padding:16px 14px 18px;color:#15181a;box-shadow:0 2px 0 #fff inset,0 8px 24px #0008;
 display:grid;grid-template-columns:15% 1fr 17%;grid-template-areas:"led win win" "back dpad ok" "off dpad ah";gap:6px 8px;align-items:center}
.ledcell{grid-area:led;display:flex;justify-content:center}.win{grid-area:win;background:#2c3034;padding:7px;border-radius:6px;box-shadow:inset 0 2px 5px #000a}
.lcd{container-type:inline-size;aspect-ratio:2/1;background:#eef0ee;color:#0e1210;border-radius:2px;padding:2.5cqw 4cqw;font-family:"Helvetica Neue",Arial,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column}
.lcd .ic{width:8cqw;height:8cqw;vertical-align:middle}.lcd .ic.big{width:15cqw;height:15cqw}
.r1{display:flex;align-items:center;gap:3cqw;font-size:8cqw;font-weight:600;line-height:1.1}.tg{margin-left:auto}.tg small{font-size:8cqw;margin-left:1cqw}
.big{font-size:27cqw;line-height:1;font-weight:500;text-align:center;letter-spacing:-.01em;margin-top:2cqw;font-variant-numeric:tabular-nums}.big.ed{font-size:22cqw}
.un{font-size:9cqw;text-align:right;font-weight:600;margin-top:-1cqw;padding-right:20cqw}
.r3{position:absolute;left:4cqw;right:4cqw;bottom:2cqw;display:flex;justify-content:space-between;font-size:7cqw;font-weight:600}.r3 .ic{width:9cqw;height:9cqw}
.msgrow{display:flex;align-items:center;gap:3cqw;margin-top:4cqw;font-size:19cqw;font-weight:500}.msgrow.w{font-size:10cqw;margin-top:12cqw;font-weight:600}.msgrow.w .ic{width:12cqw;height:12cqw}
.rs{position:absolute;right:4cqw;bottom:3cqw;font-size:11cqw;font-weight:600}
.blink{animation:blink 1s steps(2) infinite}
.ttl{font-size:8cqw;font-weight:700;border-bottom:.8cqw solid #0e1210;padding-bottom:1cqw;margin-bottom:1cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li{display:flex;justify-content:space-between;gap:3cqw;font-size:9cqw;font-weight:600;padding:.4cqw 1.5cqw;line-height:1.25;white-space:nowrap}.li span:first-child{overflow:hidden;text-overflow:ellipsis}.li.sel{background:#0e1210;color:#eef0ee}
.evn{font-size:10cqw;font-weight:600;margin-top:5cqw}
.pk{border:0;background:none;color:#15181a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;min-width:48px;font:600 12px var(--sans);touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:10px}
.pk svg{width:28px;height:28px}.pk:active{background:#0002}.pk:focus-visible{outline:3px solid #1b7fd0}
.back{grid-area:back}.ok{grid-area:ok}.off{grid-area:off}.ah{grid-area:ah}.off span{color:#c0182e}.ah span{color:#15781f}
.dpad{grid-area:dpad;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);grid-template-areas:". u ." "l . r" ". d .";justify-items:center;align-items:center;min-height:150px}
.u{grid-area:u}.l{grid-area:l}.r{grid-area:r}.d{grid-area:d}.dpad .pk{min-width:52px;min-height:52px}
.cap{max-width:420px;margin:10px auto 0;font-size:14px;color:var(--ink);min-height:2.8em}.cap b{color:var(--cyan)}
.tray{padding:14px;max-width:760px}
h2{font-size:15px;margin:20px 0 8px;color:var(--cyan);font-weight:600}h2:first-child{margin-top:0}
.tog,.sl,.wr{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:6px 0;border-bottom:1px solid var(--line)}
.sl{flex-wrap:wrap}.sl input{width:100%}.tog input{width:26px;height:26px}
select,input[type=number],input[type=search],textarea{background:#1c1f22;color:var(--ink);border:1px solid var(--line);border-radius:4px;font:16px var(--sans);padding:8px;min-height:44px}
select{max-width:60%}textarea{width:100%;min-height:90px;font:12px var(--mono)}
button.btn{min-height:44px;padding:0 14px;margin:4px 6px 4px 0;border-radius:4px;border:1px solid var(--line);background:#3a4047;color:var(--ink);font:600 14px var(--sans)}
.hint{color:var(--mut);font-size:13px}.on{color:var(--green)}.off2{color:var(--mut)}.bad{color:#ff8a9a}
.sig{font-family:var(--mono);font-size:13px;padding:4px 0}
.item{padding:10px 0;border-bottom:1px solid var(--line)}.item b{font-weight:600}
.tag{font:600 11px var(--sans);padding:2px 6px;border-radius:3px;border:1px solid var(--mut);color:var(--mut);margin-left:6px}
.tag.live{border-color:var(--green);color:var(--green)}.tag.fault{border-color:var(--crim);color:#ff8a9a}.tag.warning{border-color:var(--amber);color:var(--amber)}
.pr{display:flex;justify-content:space-between;gap:10px;align-items:center}.pr input,.pr select{width:42%;max-width:42%}
details{margin-top:12px}summary{min-height:44px;display:flex;align-items:center;color:var(--cyan);font-weight:600}
.tt{width:100%;border-collapse:collapse;font:12px var(--mono)}.tt td{padding:3px 6px;border-bottom:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#1a1c1f;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:56px;border:0;background:none;color:var(--mut);font:600 13px var(--sans)}.tabs button.sel{color:#fff;box-shadow:inset 0 3px 0 var(--crim)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
@media(min-width:900px){main{display:grid;grid-template-columns:460px 1fr;align-items:start}.drive{position:sticky;top:0}
 body .strip{display:none!important}body .panelwrap{display:block!important}}
@media(prefers-reduced-motion:reduce){.blink,.led.greenflash{animation:none!important}}
.lcd>*{flex-shrink:0}.li{font-size:8cqw;line-height:1.2}.ttl{font-size:7cqw}

.lcd .li .t{display:flex;align-items:center;gap:2cqw;overflow:hidden;white-space:nowrap}.lcd .li .ic{width:8cqw;height:8cqw;flex:none}.lcd .ttl{display:flex;align-items:center;gap:2cqw}.lcd .ttl .ic{width:8cqw;height:8cqw}
.lcd .dr{font-size:5cqw;font-weight:600;margin-left:-1cqw}.lcd .r3 .sk{display:flex;align-items:center;gap:1.5cqw}.lcd .r3 small{font-size:5cqw;font-weight:600}
.lg{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}.lcdi{background:#eef0ee;color:#0e1210;border-radius:3px;padding:3px;display:inline-flex}.lcdi svg{width:26px;height:26px}
.lcd{--lcdbg:#eef0ee}.lcd .li.sel{--lcdbg:#0e1210}.lcd .un{text-align:center;padding-right:0}

.led.off{background:#555}
.note{margin-top:6px;padding:6px 8px;border-left:3px solid var(--amber);background:#2a2d31;color:var(--ink);font-size:13px}
.seg{display:flex;flex-wrap:wrap}.btn.selb{background:var(--crim);border-color:var(--crim);color:#fff}
.mtag{margin:8px 0;padding:10px 12px;border:2px solid #8b8f94;border-radius:6px;background:#d9dcde;color:#15181a;font:600 14px var(--mono);line-height:1.5}.mtag .bhp{display:inline-block;margin-top:4px;padding:2px 8px;background:#ffd84a;border-radius:3px}
.pt{font:12px var(--sans)}.pt th{text-align:left;color:var(--mut);padding:3px 6px;border-bottom:1px solid var(--line)}.pt td{vertical-align:top}
</style></head>

 if(L==='hvac'){const w=C.wiring,f=C.field,ok=(sw,di)=>w[di]===sw&&f[sw].feed!=='none'&&w.dcom!=='none'&&f[sw].feed!==w.dcom;

   ['4. Line voltage: L1/L2/L3 to the drive input and T1/T2/T3 (U/V/W) to the motor, matching the previous VFD (Wiring tab)',wi().line==='ok'&&wi().motor==='ok'],

const lessonBody=()=>{const L=C.les.lesson,t=tag();
 if(L==='hvac')return `<p class="hint">HVAC default macro: the factory I/O. Start with a fresh drive, wire DI1 as start, DI4 as the start interlock, and AI1 as the 0 to 10 V reference.</p>
<div class="item">1. With the drive running in Auto, set 20.03 Ext1 in1 source to DI2. DI1 is still wired and closed, but the drive stops: the program no longer looks at DI1.</div><div class="item">2. Set 20.41 Start interlock 1 to Not used. The AFEE warning disappears even with DI4 unwired.</div><div class="item">3. Wire DI3 to a closed switch: constant frequency 1 (28.26) takes over from the AI1 reference. Set 28.22 to Always off and it stops.</div><div class="item">4. Set 31.01 External event 1 source to DI2. DI2 is not wired, so it reads 0 and the drive trips on 9081.</div><div class="item">5. Set the AI1 hardware mode to Current but leave 12.15 on V: the drive reads 0.</div>
<button class="btn" data-act="wireHvac">Wire for start-up</button>
<p class="hint">Then try: Hand mode (Auto/Hand key, pick Hand, OK), set a reference under Back > Reference value, open the interlock, or inject a fault.</p>`;
 if(L==='two')return `<p class="hint">Source: ACH550/ACH180 Retrofit Guide for the Carrier 2 speed VFD electromechanical application (Comfort Systems USA FIX Support Center, document by Matthew Pienta). The drive runs low speed on constant frequency 1 (DI2) and high speed on constant frequency 2 (DI3).</p>
<label class="tog"><span>1. No power at the disconnect, lockout/tagout performed</span><input type="checkbox" data-les="loto" ${C.les.loto?'checked':''}></label>
<label class="tog"><span>2. Motor data tag and BHP sticker recorded (photo taken)</span><input type="checkbox" data-les="photo" ${C.les.photo?'checked':''}></label>
<div class="mtag"><b>Blower motor data tag</b><div>${t.hp} HP | ${t.V} V | ${t.Hz} Hz | ${t.rpm} RPM | 3 phase</div><div>FLA ${t.FLA} A | SF 1.15 | SFA ${t.SFA} A</div><div class="bhp">Sticker above the tag: BHP ${t.bhp}</div></div><button class="btn" data-act="nextTag">Next motor tag</button>
<h2>Low voltage wiring connections</h2><table class="tt pt"><tr><th>Wire</th><th>ACH550</th><th>ACH180</th></tr>${[['Pink VFD-10/24+','10/24+','21/24v'],['Blue VFD-11/GND','11/GND','22/DGND'],['Blue VFD-12/DCOM','12/DCOM','12/DCOM'],['Pink VFD-13/DI1','13/DI1','8/DI1'],['Yellow VFD-14/DI2','14/DI2','9/DI2'],['White VFD-15/DI3','15/DI3','10/DI3'],['Pink VFD-16/DI4','16/DI4','11/DI4'],['Black jumpers remain intact','','1/S+ to 3/S1 and 1/S+ to 4/S2']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>
<p class="hint">Trainer reading of the table: the pink 24+ wire powers the Carrier contacts, so on the Wiring tab set every contact's other side to +24V, tie DCOM to DGND, and wire DI1 start, DI2 low speed, DI3 high speed, DI4 the fourth contact. 20.41 = 1 means the drive does not need DI4 to start.</p>
<h2>Line voltage wiring connections</h2><p class="hint">Power cables should match the previous VFD: L1, L2, L3 to the drive input; T1/U, T2/V, T3/W to the motor U1, V1, W1, with the earth conductors. Set both on the Wiring tab.</p>
<button class="btn" data-act="wireTwo">Wire it for me (steps 3 and 4)</button>`;
 if(L==='pid')return `<p class="hint">Source: ACH180 firmware manual 3AXD50000955893 Rev B, application example "Supply fan, PID control" (page 60 to 62). The drive holds static duct pressure: it speeds up when pressure is low and slows down when it is high. ACH180 has no PID choice in 96.04 (Done and HVAC default only), so this is a parameter and wiring example, not a macro.</p>
<div class="item"><b>Wiring (manual)</b><div class="hint">DI1 (T8): start/stop from the BAS | DI3 (T10): freezestat, start interlock 2 | DI4 (T11): overpressure, start interlock 1 | AI1 (T14): BAS setpoint 4-20 mA (4 mA = 0, 20 mA = 2.0 inWC) | AI2 (T15): pressure transducer 4-20 mA (0 to 5 inWC) | RO1 (T5-T7): running feedback to the BAS | AO: zero.</div></div>
<p class="hint">Test: Panel tab, close the start and the two safety contacts, set the BAS setpoint slider (12 mA = 1.0 inWC), run in Auto. Move the duct load slider to disturb the process. Open the overpressure contact.</p>

<h2>Scenario</h2><button class="btn" data-act="fast">Simulation speed: ${C.fast?'5x (tap for 1x)':'1x (tap for 5x)'}</button><button class="btn" data-act="pause">${R.paused?'Resume':'Pause'} simulation</button><button class="btn" data-act="factory">Restore factory state</button>
<button class="btn" data-act="export">Export JSON</button><button class="btn" data-act="import">Import JSON</button><textarea id="json" aria-label="Scenario JSON"></textarea>
<h2>What is simulated</h2><p class="hint">Panel views, menu structure, default I/O, parameter IDs and defaults, interlock behavior, EXT1/EXT2, constant frequencies, process PID, AI1/AI2, STO and event codes follow the ABB manual. The macro (96.04), save (96.07) and restore (96.06) parameters act and revert to Done as on the drive. Ramps, current, overload timing, coast time, the PID scaling, the duct model and wiring rules are simplified training models. This app is not endorsed by ABB or Carrier, controls no equipment, and does not replace the manuals, the retrofit guide, qualified personnel or safe commissioning.</p>`}};
function plist(){const f=q.toLowerCase().trim();const all=PARAMS.filter(p=>(!qg||(qg==='sim'?p.live:(p.id||'').startsWith(qg+'.')))&&(!f||(p.id||'').includes(f)||p.name.toLowerCase().includes(f)));
 const rows=all.slice(0,lim).map(p=>{const v=C.params[p.k];let inp;
  if(p.ro){const x=p.id?E.roVal(p.id,C,R):undefined;inp=`<span>${esc(x===undefined?p.def:typeof x==='number'?x.toFixed(2):x)} (read-only)</span>`}
  else if(p.choices)inp=`<select data-p="${p.k}" aria-label="${esc(p.name)}">${opt(p.choices.map((c,i)=>[p.vals[i],esc(c)]),v)}</select>`;
  else if(p.hex)inp=`<input type="text" data-ph="${p.k}" value="${esc(v)}" aria-label="${esc(p.name)}" maxlength="9" autocapitalize="characters">`;
  else if(p.text)inp=`<input type="text" data-pt="${p.k}" value="${esc(v)}" aria-label="${esc(p.name)}" maxlength="40">`;
  else if(p.min!==undefined)inp=`<input type="number" inputmode="decimal" step="any" data-p="${p.k}" value="${v}" aria-label="${esc(p.name)}">`;
  else inp=`<span>${esc(v)}</span>`;
  const range=p.free?'any value':p.min!==undefined?`${p.min} to ${p.max} ${esc(p.unit||'')}`:p.hex?'hex bit field':'';
  return `<div class="item"><div class="pr"><div><b>${p.id||'\u2014'} ${esc(p.name)}</b><span class="tag ${p.live?'live':''}">${p.ro?(p.live?'live value':'signal'):p.live?'simulated':'stored'}</span><div class="hint">${range}${p.note?' '+esc(p.note):''}</div><div class="hint">${esc(p.desc||'')}</div></div>${inp}</div><div class="bad" id="e-${p.k}"></div></div>`}).join('');
 return (rows||'<p class="hint">No match.</p>')+(all.length>lim?`<button class="btn" data-act="more">Show more (${all.length-lim} left)</button>`:'')}
function show(){document.body.dataset.view=tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('sel',b.dataset.tab===tab));$('#tray').innerHTML=views[tab]()}
const wireClear=()=>{Object.assign(C.wiring,{...E.defaults().wiring});for(const k in FIELD)C.field[k].feed='none'};
const wireTo=(w,feeds)=>{wireClear();Object.assign(C.wiring,w);for(const k of feeds)C.field[k].feed='+24V'};
function applyKey(id){const list=keyList[id]();E.setMode(C,R,'OFF');E.halt();for(const[pid,v]of list)E.setParam(C,KOF[pid],v)}
const acts={more:()=>{lim+=60;show()},reset:()=>{E.reset(C,R);show()},pause:()=>{R.paused=!R.paused;show()},fast:()=>{C.fast=!C.fast;show()},
 wiredemo:()=>{Object.assign(C.wiring,{dcom:'DGND',di1:'runSw',di4:'intSw',ai1:'pot',ai1mode:'V'});C.field.runSw.feed='+24V';C.field.intSw.feed='+24V';save();show()},
 wireHvac:()=>{acts.wiredemo()},
 wireTwo:()=>{wireTo({dcom:'DGND',di1:'runSw',di2:'spd1Sw',di3:'spd2Sw',di4:'intSw'},['runSw','spd1Sw','spd2Sw','intSw']);save();show()},
 wirePid:()=>{wireTo({dcom:'DGND',di1:'runSw',di3:'frzSw',di4:'intSw',ai1:'loop',ai1mode:'mA',ai2:'xd',ai2mode:'mA'},['runSw','frzSw','intSw']);save();show()},
 wireclear:()=>{wireClear();save();show()},
 nextTag:()=>{C.les.tag=(C.les.tag+1)%TAGS.length;save();show()},
 cycle:()=>{C.power=true;R=E.newRuntime();P=K.newPanel();C.mode='AUTO';C.les.offPressed=false;save();show()},
 les_hvac:()=>{C.les.lesson='hvac';save();show()},les_two:()=>{C.les.lesson='two';save();show()},les_pid:()=>{C.les.lesson='pid';save();show()},
 key_two:()=>{applyKey('two');save();show()},key_pid:()=>{applyKey('pid');save();show()},
 factory:()=>{if(confirm('Restore the factory simulator state? Wiring, parameter edits and lesson progress will be lost.')){C=E.defaults();R=E.newRuntime();P=K.newPanel();save();show()}},
 export:()=>{$('#json').value=JSON.stringify({app:'ach180-trainer',v:3,config:C},null,1)},
 import:()=>{try{const j=JSON.parse($('#json').value);if(j.app!=='ach180-trainer'||!j.config)throw 0;C=E.merge(E.defaults(),j.config);save();R=E.newRuntime();P=K.newPanel();show();$('#json').value=''}catch{$('#json').value='Import failed: paste a scenario exported from this app.'}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;show()}else acts[t.dataset.act]?.()});
let rep=null;const stopRep=()=>{clearTimeout(rep);clearInterval(rep);rep=null};
const key=k=>{K.press(C,R,P,k);save();draw()};
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-k]');if(!b)return;e.preventDefault();const k=b.dataset.k;key(k);
 if(['up','down','left','right'].includes(k)){stopRep();rep=setTimeout(()=>{rep=setInterval(()=>key(k),120)},450)}});
['pointerup','pointercancel','pointerleave'].forEach(n=>document.addEventListener(n,stopRep));
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',Escape:'back'}[e.key];if(m&&!e.target.closest('button')){e.preventDefault();key(m)}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(e.target.id==='qg'){qg=e.target.value;lim=60;$('#plist').innerHTML=plist();return}
 if(d.sw){C.field[d.sw].closed=e.target.checked}else if(d.inj){C.inject[d.inj]=e.target.checked}
 else if(d.pw){C.power=e.target.checked;R=E.newRuntime();P=K.newPanel();if(C.power){C.mode='AUTO';C.les.offPressed=false}}
 else if(d.les){C.les[d.les]=e.target.checked}
 else if(d.w!==undefined){const v=e.target.value;C.wiring[d.w]=(d.w==='sto1'||d.w==='sto2')?v==='true':v}
 else if(d.f){const[a,b]=d.f.split('.');C.field[a][b]=e.target.value}
 else if(d.p){const p=E.P_BY[d.p],err=$('#e-'+p.k);
  if(p.choices){E.setParam(C,p.k,Number(e.target.value));err.textContent=E.takeNote();e.target.value=C.params[p.k]}
  else{const v=Number(e.target.value);if(e.target.value===''||!Number.isFinite(v)||v<p.min||v>p.max){err.textContent=p.free?'Enter a number.':`Enter a value from ${p.min} to ${p.max} ${p.unit||''}.`;e.target.value=C.params[p.k];return}E.setParam(C,p.k,v);err.textContent=E.takeNote();e.target.value=C.params[p.k]}}
 else if(d.pt){const p=E.P_BY[d.pt];E.setParam(C,p.k,e.target.value);$('#e-'+p.k).textContent=''}
 else if(d.ph){const p=E.P_BY[d.ph],err=$('#e-'+p.k),r=E.setParam(C,p.k,e.target.value);if(r===C.params[p.k]&&String(e.target.value).toUpperCase().replace(/H$/,'').padStart(4,'0')+'h'!==C.params[p.k]){err.textContent=E.takeNote()||'Enter 1 to 8 hex digits, for example 0001h.';e.target.value=C.params[p.k];return}err.textContent=E.takeNote()}
 else return;save();if(d.p||d.pt||d.ph){if(p0(d))return}show()});
function p0(d){const k=d.p||d.pt||d.ph;return ['macroSel','saveP','restore'].includes(k)?(show(),true):true}
document.addEventListener('input',e=>{const d=e.target.dataset;
 if(d.sl){C.field[d.sl]=Number(e.target.value);const v=C.field[d.sl];$('#o-'+d.sl).textContent=d.sl==='pot'?`${(v/10).toFixed(1)} V`:d.sl==='loop'?`${v.toFixed(1)} mA`:`${v} %`;save()}
 else if(e.target.id==='q'){q=e.target.value;lim=60;$('#plist').innerHTML=plist()}});
let last=performance.now(),tk=0;setInterval(()=>{const n=performance.now(),dt=Math.min(0.25,(n-last)/1000);last=n;const wn=R.hist.length,k=C.fast?5:1;for(let i=0;i<k;i++)E.tick(C,R,dt);
 const h=C.les.hits;let ch=false;
 if(R.constN&&R.ref>0&&Math.abs(R.hz-R.ref)<0.15&&!R.fault){const r=Math.round(R.ref);if(!h[r]){h[r]=true;ch=true}}
 if(R.pid.on&&Math.abs(R.pid.dev)<0.03&&R.hz>1){R.settleT+=dt;if(R.settleT>6&&!h.pid){h.pid=true;ch=true}}else R.settleT=0;
 if(R.warns.has('AFEE')&&C.params.il1txt===4&&!h.il){h.il=true;ch=true}
 if(R.fault==='5091'&&R.ro1&&!h.sto&&lab0('ro1src')==='Fault'){h.sto=true;ch=true}
 if(ch)save();
 draw();if(tab==='faults'&&R.hist.length!==wn)show();
 tk++;if(tk%10===0){if(tab==='learn'){const el=$('#lchk');if(el)el.innerHTML=lchk()}}
 if(tab==='panel'){const el=$('#proc');if(el)el.textContent=`Duct ${R.duct.toFixed(2)} inWC | transducer ${E.ai2(C,R).val.toFixed(2)} mA | fan ${R.hz.toFixed(1)} Hz`}},100);
const lab0=k=>E.lab(k,C);
show();draw();

</script>
</body></html>
